<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Liberation Sans, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">ICU prediction pipeline</title>
<desc id="d">MIMIC-IV data with about 94,000 ICU admissions is loaded in chunks, merged and preprocessed, then split into two tasks. Mortality classification uses a 90/10 split with undersampling and compares four classifiers; XGBoost reached 0.90 AUC. Length-of-stay regression for survivors, which was my part, uses an 80/20 split on log length of stay and compares four regressors; Elastic Net was chosen with 0.96 days MAE.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7f8b88"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6b6b"/></marker></defs>
<rect width="1200" height="600" fill="#ffffff"/>
<text x="30" y="40" font-size="13" font-weight="700" fill="#5a666b" letter-spacing="1.5">SHARED DATA PIPELINE</text>
<rect x="30" y="60" width="240" height="110" fill="#fafaf8" stroke="#c9d1cf" stroke-width="1.2"/>
<text x="44" y="86" font-size="15" font-weight="700" fill="#1b2428">MIMIC-IV</text>
<text x="44" y="108" font-size="13" fill="#3d4a4f">~94,000 ICU admissions</text>
<text x="44" y="127" font-size="13" fill="#3d4a4f">Credentialed PhysioNet access</text>
<rect x="320" y="60" width="240" height="110" fill="#fafaf8" stroke="#c9d1cf" stroke-width="1.2"/>
<text x="334" y="86" font-size="15" font-weight="700" fill="#1b2428">Load in chunks</text>
<text x="334" y="108" font-size="13" fill="#3d4a4f">Large tables such as</text>
<text x="334" y="127" font-size="13" fill="#3d4a4f">chartevents and labevents</text>
<rect x="610" y="60" width="240" height="110" fill="#fafaf8" stroke="#c9d1cf" stroke-width="1.2"/>
<text x="624" y="86" font-size="15" font-weight="700" fill="#1b2428">Merge tables</text>
<text x="624" y="108" font-size="13" fill="#3d4a4f">Clinical, demographic and</text>
<text x="624" y="127" font-size="13" fill="#3d4a4f">diagnosis data by patient</text>
<rect x="900" y="60" width="270" height="150" fill="#fafaf8" stroke="#c9d1cf" stroke-width="1.2"/>
<text x="914" y="86" font-size="15" font-weight="700" fill="#1b2428">Preprocess</text>
<text x="914" y="108" font-size="13" fill="#3d4a4f">Ages 18 to 90</text>
<text x="914" y="127" font-size="13" fill="#3d4a4f">Physiological plausibility checks</text>
<text x="914" y="146" font-size="13" fill="#3d4a4f">Iterative Imputer, one-hot encoding</text>
<text x="914" y="165" font-size="13" fill="#3d4a4f">Drop readmissions and stays of</text>
<text x="914" y="184" font-size="13" fill="#3d4a4f">1 day or less</text>
<path d="M270 115 L318 115" fill="none" stroke="#7f8b88" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M560 115 L608 115" fill="none" stroke="#7f8b88" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M850 115 L898 115" fill="none" stroke="#7f8b88" stroke-width="1.8" marker-end="url(#a)"/>
<text x="30" y="270" font-size="13" font-weight="700" fill="#5a666b" letter-spacing="1.5">MORTALITY (CLASSIFICATION)</text>
<rect x="30" y="290" width="250" height="100" fill="#fafaf8" stroke="#c9d1cf" stroke-width="1.2"/>
<text x="44" y="316" font-size="15" font-weight="700" fill="#1b2428">First 24 hours</text>
<text x="44" y="338" font-size="13" fill="#3d4a4f">All ICU stays</text>
<text x="44" y="357" font-size="13" fill="#3d4a4f">Mortality label</text>
<rect x="320" y="290" width="250" height="100" fill="#fafaf8" stroke="#c9d1cf" stroke-width="1.2"/>
<text x="334" y="316" font-size="15" font-weight="700" fill="#1b2428">90 / 10 split</text>
<text x="334" y="338" font-size="13" fill="#3d4a4f">Class balancing by</text>
<text x="334" y="357" font-size="13" fill="#3d4a4f">undersampling</text>
<rect x="610" y="290" width="250" height="100" fill="#fafaf8" stroke="#c9d1cf" stroke-width="1.2"/>
<text x="624" y="316" font-size="15" font-weight="700" fill="#1b2428">Four classifiers</text>
<text x="624" y="338" font-size="13" fill="#3d4a4f">Logistic Regression, Random</text>
<text x="624" y="357" font-size="13" fill="#3d4a4f">Forest, XGBoost, MLP</text>
<rect x="900" y="290" width="270" height="100" fill="#fafaf8" stroke="#c9d1cf" stroke-width="1.2"/>
<text x="914" y="316" font-size="15" font-weight="700" fill="#1b2428">XGBoost chosen</text>
<text x="914" y="338" font-size="13" fill="#3d4a4f">ROC-AUC 0.90, recall 0.92</text>
<text x="914" y="357" font-size="13" fill="#3d4a4f">Target was AUC 0.85 or more</text>
<path d="M280 340 L318 340" fill="none" stroke="#7f8b88" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M570 340 L608 340" fill="none" stroke="#7f8b88" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M860 340 L898 340" fill="none" stroke="#7f8b88" stroke-width="1.8" marker-end="url(#a)"/>
<text x="30" y="440" font-size="13" font-weight="700" fill="#1f6b6b" letter-spacing="1.5">LENGTH OF STAY (REGRESSION) · MY PART</text>
<rect x="30" y="460" width="250" height="100" fill="#e3f0ef" stroke="#1f6b6b" stroke-width="2"/>
<text x="44" y="486" font-size="15" font-weight="700" fill="#1f6b6b">Survivors only</text>
<text x="44" y="508" font-size="13" fill="#3d4a4f">First 24 hours</text>
<text x="44" y="527" font-size="13" fill="#3d4a4f">Length of stay in days</text>
<rect x="320" y="460" width="250" height="100" fill="#e3f0ef" stroke="#1f6b6b" stroke-width="2"/>
<text x="334" y="486" font-size="15" font-weight="700" fill="#1f6b6b">80 / 20 split</text>
<text x="334" y="508" font-size="13" fill="#3d4a4f">Log-transformed</text>
<text x="334" y="527" font-size="13" fill="#3d4a4f">length of stay</text>
<rect x="610" y="460" width="250" height="100" fill="#e3f0ef" stroke="#1f6b6b" stroke-width="2"/>
<text x="624" y="486" font-size="15" font-weight="700" fill="#1f6b6b">Four regressors</text>
<text x="624" y="508" font-size="13" fill="#3d4a4f">Elastic Net, KNN,</text>
<text x="624" y="527" font-size="13" fill="#3d4a4f">Random Forest, XGBoost</text>
<rect x="900" y="460" width="270" height="100" fill="#e3f0ef" stroke="#1f6b6b" stroke-width="2"/>
<text x="914" y="486" font-size="15" font-weight="700" fill="#1f6b6b">Elastic Net chosen</text>
<text x="914" y="508" font-size="13" fill="#3d4a4f">MAE 0.96 days (best 0.94)</text>
<text x="914" y="527" font-size="13" fill="#3d4a4f">Target was MAE of 1 day or less</text>
<path d="M280 510 L318 510" fill="none" stroke="#1f6b6b" stroke-width="1.8" marker-end="url(#b)"/>
<path d="M570 510 L608 510" fill="none" stroke="#1f6b6b" stroke-width="1.8" marker-end="url(#b)"/>
<path d="M860 510 L898 510" fill="none" stroke="#1f6b6b" stroke-width="1.8" marker-end="url(#b)"/>
<path d="M1035 210 L1035 232 L12 232 L12 340 L28 340" fill="none" stroke="#7f8b88" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M1170 135 L1188 135 L1188 410 L20 410 L20 510 L28 510" fill="none" stroke="#1f6b6b" stroke-width="1.8" marker-end="url(#b)"/>
</svg>